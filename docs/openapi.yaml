                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "資料庫無法使用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
