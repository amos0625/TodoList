                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "超過 32 KB",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "須使用 application/json",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "內部錯誤",
            "content": {
              "application/json": {
